name: Release Postgres Job

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version tag without V prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  postgres:
    name: Build docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2 # Action page: <https://github.com/docker/setup-qemu-action>

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2 # Action page: <https://github.com/docker/setup-buildx-action>

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate builder values
        id: values
        run: |
          echo "version=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(echo $(date +%FT%T%z))" >> $GITHUB_OUTPUT
          echo "tag=postgres/v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Build image
        uses: docker/build-push-action@v4 # Action page: <https://github.com/docker/build-push-action>
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.values.outputs.version }}
            BUILD_TIME=${{ steps.values.outputs.timestamp }}
          tags: |
            swarmdeployorg/init-jobs-postgres:${{ steps.values.outputs.version}}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.values.outputs.tag }}
          name: ${{ steps.values.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: ${{ steps.values.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}